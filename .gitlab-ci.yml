# Publishes the static game to GitLab Pages on every push to the default branch.
# There is no build step: the site is just the game's files.
create-pages:
  stage: deploy
  image: busybox:stable
  script:
    - mkdir public
    - cp -r index.html css js public/
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
